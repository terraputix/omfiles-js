version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: direct
    commit-message:
      prefix: "chore(deps): "
    cooldown:
      default-days: 7
    groups:
      openmeteo:
        patterns:
          - "*"
      openmeteo-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci: "
    cooldown:
      default-days: 7
